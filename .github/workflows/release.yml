name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI help
        run: python handback.py --help
      - name: Preview installation in an isolated home
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP ('handback-dry-run-' + [guid]::NewGuid().ToString('N'))
          & .\install.ps1 -DryRun -TargetHome $fixtureRoot
          if (Test-Path -LiteralPath $fixtureRoot) {
            throw 'Dry-run unexpectedly created files in the target home.'
          }

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check tag matches package version
        if: github.event_name == 'push'
        shell: python {0}
        run: |
          import os
          import sys

          sys.path.insert(0, os.getcwd())  # the step script runs from a temp directory
          from handback import __version__

          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{__version__}':
              raise SystemExit(f'Tag {tag!r} does not match package version {__version__!r}')
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    name: Smoke / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Test installed wheel in a fresh environment
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import venv

          wheels = list(Path('dist').resolve().glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'Expected exactly one wheel, found {len(wheels)}')
          with tempfile.TemporaryDirectory(prefix='handback-smoke-', dir=os.environ['RUNNER_TEMP']) as temp:
              root = Path(temp)
              environment = root / 'venv'
              venv.EnvBuilder(with_pip=True).create(environment)
              scripts = environment / ('Scripts' if os.name == 'nt' else 'bin')
              python = scripts / ('python.exe' if os.name == 'nt' else 'python')
              cli = scripts / ('handback.exe' if os.name == 'nt' else 'handback')
              subprocess.run([str(python), '-m', 'pip', 'install', '--no-deps', str(wheels[0])], check=True, cwd=root)
              subprocess.run([str(cli), '--help'], check=True, cwd=root)
              target_home = root / 'target-home'
              subprocess.run([str(cli), 'install-skills', '--dry-run', '--target-home', str(target_home)], check=True, cwd=root)
              if target_home.exists():
                  raise SystemExit('Dry-run unexpectedly created the target home')

  publish:
    needs: [test, build, smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  windows-exe:
    # Independent of PyPI publishing: nothing needs this job and it does not gate publish.
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build Windows bundle
        run: .\packaging\build.ps1 -OutDir "$env:RUNNER_TEMP\handback-exe"
      - name: Verify version matches tag
        run: |
          $version = (& "$env:RUNNER_TEMP\handback-exe\dist\handback\handback.exe" --version | Out-String).Trim()
          $expected = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch [regex]::Escape($expected)) { throw "Built version '$version' does not match tag '$env:GITHUB_REF_NAME'" }
      - name: Smoke-test the bundle
        run: .\packaging\smoke.ps1 -Folder "$env:RUNNER_TEMP\handback-exe\dist\handback"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}\handback-exe\handback-*-windows-x64.zip
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'handback-exe'
          $zip = (Get-ChildItem -LiteralPath $out -Filter 'handback-*-windows-x64.zip').FullName
          $sums = Join-Path $out 'SHA256SUMS.txt'
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --verify-tag --generate-notes
            if ($LASTEXITCODE -ne 0) {
              gh release view $env:GITHUB_REF_NAME *> $null
              if ($LASTEXITCODE -ne 0) { throw 'release create failed' }
            }
          }
          gh release upload $env:GITHUB_REF_NAME $zip $sums --clobber
          if ($LASTEXITCODE -ne 0) { throw 'release upload failed' }
