name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check tag matches package version
        if: github.event_name == 'push'
        shell: python {0}
        run: |
          import os
          from handback import __version__

          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{__version__}':
              raise SystemExit(f'Tag {tag!r} does not match package version {__version__!r}')
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    name: Smoke / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Test installed wheel in a fresh environment
        shell: python {0}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import venv

          wheels = list(Path('dist').resolve().glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'Expected exactly one wheel, found {len(wheels)}')
          with tempfile.TemporaryDirectory(prefix='handback-smoke-', dir=os.environ['RUNNER_TEMP']) as temp:
              root = Path(temp)
              environment = root / 'venv'
              venv.EnvBuilder(with_pip=True).create(environment)
              scripts = environment / ('Scripts' if os.name == 'nt' else 'bin')
              python = scripts / ('python.exe' if os.name == 'nt' else 'python')
              cli = scripts / ('handback.exe' if os.name == 'nt' else 'handback')
              subprocess.run([str(python), '-m', 'pip', 'install', '--no-deps', str(wheels[0])], check=True, cwd=root)
              subprocess.run([str(cli), '--help'], check=True, cwd=root)
              target_home = root / 'target-home'
              subprocess.run([str(cli), 'install-skills', '--dry-run', '--target-home', str(target_home)], check=True, cwd=root)
              if target_home.exists():
                  raise SystemExit('Dry-run unexpectedly created the target home')

  publish:
    needs: [build, smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
