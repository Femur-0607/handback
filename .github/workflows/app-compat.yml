name: App compatibility

# Weekly read-only compatibility check against the newest published Codex CLI and
# Claude Code. A failure opens a GitHub issue (one per app version).
on:
  schedule:
    - cron: '0 0 * * 1'  # Mondays 00:00 UTC (09:00 KST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: npm ${{ matrix.channel }}
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: latest
            packages: '@openai/codex@latest @anthropic-ai/claude-code@latest'
            agents: codex claude
          # Codex desktop ships alpha builds; this leg warns before they reach the app.
          - channel: alpha
            packages: '@openai/codex@alpha'
            agents: codex
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install the newest CLIs
        run: |
          npm install -g ${{ matrix.packages }}
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
      - name: Run compatibility checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/compat_ci.py --channel ${{ matrix.channel }} --agents ${{ matrix.agents }} --open-issues
          if ($LASTEXITCODE -ne 0) { throw 'Compatibility check failed; see the opened issue.' }
