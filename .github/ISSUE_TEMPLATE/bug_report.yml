name: Bug report
description: Report a reproducible agent-relay problem.
body:
  - type: markdown
    attributes:
      value: |
        agent-relay is experimental and currently targets Windows. App updates can affect compatibility.
        Remove tokens, private prompts, usernames, absolute paths, and conversation IDs before posting.
        Do not attach a complete state directory or app transcript.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the redacted block from agent-relay doctor --root <project> --report. Include the commit if running from source.
      placeholder: |
        Paste doctor --report here (OS, Python, tool/app versions, checks, topology).
        Source commit, if applicable:
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command with private values replaced by placeholders.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the exit code and whether message acceptance is known or uncertain.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      description: Paste only the relevant excerpt. Omit private conversation content and credentials.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, private prompts, personal paths, and conversation IDs from this report.
          required: true
