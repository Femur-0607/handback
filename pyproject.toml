[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handback"
dynamic = ["version"]
description = "Local, durable relay between coding-agent apps"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
handback = "handback.cli:main"

[project.gui-scripts]
handback-dashboard = "handback.dashboard:main"

[tool.setuptools.dynamic]
# Explicit __init__ avoids confusing the package with the checkout launcher.
version = {attr = "handback.__init__.__version__"}

[tool.setuptools.package-dir]
handback = "handback"

[tool.setuptools.packages.find]
include = ["handback*"]
namespaces = false

[tool.setuptools.package-data]
handback = ["skills/SKILL.md", "skills/*/SKILL.md.in", "assets/*.png", "assets/*.ico"]
